
name: CI - Build and Test

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-n-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: dimmmon/task-api:latest
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: dimmmon/task-frontend:latest

      - name: Build and push Migrations Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./migration/Dockerfile
          push: true
          tags: dimmmon/task-migrations:latest

  helm-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.0

      - name: Lint Helm Chart
        run: helm lint ./k8s

      - name: Render Kubernetes manifests
        run: helm template task-manager ./k8s

      - name: Package Helm Chart
        run: |
          mkdir -p helm-package
          helm package ./k8s --destination helm-package

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-helm-chart
          path: helm-package/*.tgz